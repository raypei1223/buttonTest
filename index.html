<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ボタン</title>
<link rel="manifest" href="button-manifest.json">
<link rel="apple-touch-icon" href="button-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ボタン">
<meta name="theme-color" content="#c8cac4">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#c8cac4; --plate:#b4b7b0; --plate-edge:#9da099; --well:#6f726c;
  --cap-hi:#d9473d; --cap:#b3261e; --cap-lo:#7d1712; --side:#5e0f0b;
  --shadow:rgba(40,42,38,.35);
  --led-off:#7f8b7f; --led-ring:#9a9d96; --bz-hi:#d2d4ce; --bz-lo:#6a6d67; --lens-off-a:#5f7d65; --lens-off-b:#34503a; --sq-well:#8c8f89; --sq-hi:#cdcfc9; --sq-lo:#bfc1bb; --sq-edge:rgba(255,255,255,.5); --sq-groove:rgba(40,42,38,.3); --led-hi:#d4ffdc; --led-on:#2ee06a; --led-lo:#0f8f3a; --led-glow:rgba(46,224,106,.75); --led-glow-soft:rgba(46,224,106,.3);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{touch-action:none;overscroll-behavior:none}
body{
  background:var(--bg);
  display:grid;place-items:center;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
.stage{
  /* 液晶(上)＋ボタン一式の全体の高さは約 1.8 × --s。それが画面の高さに収まるように --s を決める */
  --s:min(78vw,50vh,380px);
  padding-top:calc(var(--s)*.36); /* 液晶ぶんの高さ。液晶も含めた全体を画面の中央に置く（ボタンは従来より下がる） */
  display:flex;flex-direction:column;align-items:center;
  gap:calc(var(--s)*.1);
}
@supports (height:100dvh){.stage{--s:min(78vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*.5),380px)}}
.leds{display:flex;gap:calc(var(--s)*.05)}
.led{
  position:relative;
  width:calc(var(--s)*.062);height:calc(var(--s)*.062);border-radius:50%;
  background:radial-gradient(circle at 38% 30%,var(--bz-hi),var(--bz-lo));
  box-shadow:0 calc(var(--s)*.006) calc(var(--s)*.012) rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.4);
}
.glow{
  position:absolute;inset:-130%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--led-glow) 0,var(--led-glow-soft) 28%,rgba(0,0,0,0) 62%);
  opacity:0;transition:opacity .22s ease-out;
}
.lens{
  position:absolute;inset:14%;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 55%,var(--lens-off-a),var(--lens-off-b) 75%);
}
.lit{
  position:absolute;inset:-1px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#f4fff7 0 14%,#7dffa6 30%,var(--led-on) 62%,var(--led-lo) 100%);
  opacity:0;transition:opacity .16s ease-out;
}
.lens::after{
  content:"";position:absolute;left:16%;top:8%;width:46%;height:32%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.8),rgba(255,255,255,0) 72%);
  transform:rotate(-28deg);opacity:.5;
}
.led.on .lit{opacity:1}
.led.on .glow{opacity:.85}
.led.on .lens::after{opacity:.75}
.sq{
  --lens-a:#fbfaf6; --lens-b:#d9d5c8; --lens-edge:rgba(255,255,255,.95);
  all:unset;position:relative;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  width:calc(var(--s)*.17);height:calc(var(--s)*.17);
  border-radius:0;
  overflow:hidden; /* 沈んだキャップは穴の中に隠れる */
  background:linear-gradient(var(--sq-groove),var(--sq-well));
  box-shadow:0 1px 0 var(--sq-edge),0 0 0 0 rgba(255,205,90,0);
  transition:box-shadow .45s ease-out;
}
/* 博物館の「押すと光る」ボタン：普段はキャップの上面が台と同じ高さ。押すと台より下に沈んで点灯する */
.sqface{
  position:absolute;inset:calc(var(--s)*.005);
  border-radius:0;
  background:radial-gradient(circle at 50% 58%,rgba(150,146,128,.3),rgba(150,146,128,0) 68%),linear-gradient(180deg,var(--lens-a),var(--lens-b));
  box-shadow:inset 0 0 0 1px var(--lens-edge),inset 0 0 0 calc(var(--s)*.005) rgba(255,255,255,.3),inset 0 0 0 calc(var(--s)*.007) rgba(120,114,92,.12),inset 0 calc(var(--s)*-.003) calc(var(--s)*.006) rgba(110,100,70,.1);
  transition:transform .12s ease-out,background .4s ease-out,box-shadow .45s ease-out;
}
.sqface::before{ /* 中央のLEDが点灯：中心が最も明るく、外側へ弱まる */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#fff 0,#fff 5%,rgba(255,255,255,.92) 10%,rgba(255,255,255,.52) 20%,rgba(255,255,255,.34) 48%,rgba(255,255,255,.26) 100%);
  opacity:0;transition:opacity .45s ease-out;
}
.sq.down .sqface::before{opacity:1;transition-duration:.04s}
.sqface::after{ /* 乳白色の拡散した映り込み */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.7) 0,rgba(255,255,255,.18) 46%,rgba(255,255,255,0) 47%),linear-gradient(180deg,rgba(255,255,255,0) 82%,rgba(255,255,255,.5) 100%);
  transition:opacity .4s ease-out;
}
.sq::after{ /* 穴の縁がキャップに落とす影（沈んだときだけ） */
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 calc(var(--s)*.016) rgba(0,0,0,.6),inset 0 calc(var(--s)*.008) calc(var(--s)*.012) rgba(0,0,0,.3),inset 0 0 0 1px var(--sq-groove);
  opacity:.35;
  transition:opacity .2s ease-out;
}
.sq::before{ /* 点灯したキャップの光が穴の壁を白く照らす */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.85),rgba(255,255,255,0) 50%);
  opacity:0;transition:opacity .45s ease-out;
}
.sq.down{
  box-shadow:0 1px 0 var(--sq-edge),0 0 calc(var(--s)*.035) calc(var(--s)*.006) rgba(255,255,255,.85),0 0 calc(var(--s)*.16) calc(var(--s)*.03) rgba(255,255,255,.4);
  transition-duration:.06s;
}
.sq.down::before{opacity:1;transition-duration:.05s}
.sq.down .sqface{
  transform:translateY(calc(var(--s)*.011)) scale(.86); /* 深く沈む：穴の中へ縮みながら引き込まれる（下端は穴の縁で隠れる） */
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 0 0 calc(var(--s)*.006) rgba(255,255,255,.55);
  transition:transform .06s ease-out,box-shadow .06s;
}
.sq.down .sqface::after{opacity:.4}
.sq.down::after{ /* 沈んだキャップの縁が穴の影に入る */
  opacity:1;transition-duration:.04s;
  box-shadow:inset 0 0 calc(var(--s)*.024) rgba(0,0,0,.65),inset 0 calc(var(--s)*.015) calc(var(--s)*.02) rgba(0,0,0,.42),inset 0 0 0 1px var(--sq-groove);
}
.sq:focus-visible{outline:3px solid var(--cap-hi);outline-offset:6px}
.plate{
  width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 35% 28%,var(--plate-edge),var(--plate) 55%);
  box-shadow:0 calc(var(--s)*.03) calc(var(--s)*.08) var(--shadow),inset 0 2px 3px rgba(255,255,255,.18);
  display:grid;place-items:center;
}
.well{
  width:78%;height:78%;border-radius:50%;
  background:var(--well);
  box-shadow:inset 0 calc(var(--s)*.025) calc(var(--s)*.05) rgba(0,0,0,.65);
  display:grid;place-items:center;
  position:relative;
}
.btn{
  all:unset;
  position:relative;
  width:84%;height:84%;border-radius:50%;
  cursor:pointer;
  touch-action:manipulation;
  transform:translateY(calc(var(--s)*-.025)); /* 側面の厚み(.05)の半分だけ上げ、キャップ+側面の塊を穴の中央に見せる */
}
.btn::before{ /* side of the cap */
  content:"";position:absolute;inset:0;border-radius:50%;
  background:var(--side);
  transform:translateY(calc(var(--s)*.05));
  box-shadow:0 calc(var(--s)*.03) calc(var(--s)*.05) rgba(0,0,0,.55);
  transition:transform .09s ease-out,box-shadow .09s ease-out;
}
.cap{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 36% 28%,var(--cap-hi),var(--cap) 45%,var(--cap-lo) 100%);
  box-shadow:inset 0 3px 4px rgba(255,255,255,.28),inset 0 -6px 12px rgba(0,0,0,.28);
  transition:transform .09s ease-out;
}
.btn.down::before{transform:translateY(calc(var(--s)*.038));box-shadow:0 1px 2px rgba(0,0,0,.5)}
.btn.down .cap{transform:translateY(calc(var(--s)*.038));transition-duration:.04s}
.btn:focus-visible{outline:3px solid var(--cap-hi);outline-offset:6px}
.smalls{display:flex;align-items:center;gap:calc(var(--s)*.09)}
/* 古びた四角い出っ張りボタン：色あせたクリーム色のプラスチックキャップ。押すと側面が隠れて沈む */
.rb{
  --rb-top-a:#d6ceb9; --rb-top-b:#c3b99f; --rb-side:#968d79; --rb-edge:rgba(255,255,255,.55); --rb-wear:rgba(255,255,255,.28);
  all:unset;position:relative;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  width:calc(var(--s)*.15);height:calc(var(--s)*.15);
  margin-bottom:calc(var(--s)*.03);
}
.rb::before{ /* キャップの側面（出っ張り） */
  content:"";position:absolute;inset:0;
  background:linear-gradient(var(--rb-side),color-mix(in srgb,var(--rb-side) 72%,#000));
  transform:translateY(calc(var(--s)*.03));
  box-shadow:0 calc(var(--s)*.014) calc(var(--s)*.02) var(--shadow);
  transition:transform .09s ease-out,box-shadow .09s ease-out;
}
.rbcap{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 38% 30%,var(--rb-wear),rgba(255,255,255,0) 62%),
    linear-gradient(160deg,var(--rb-top-a),var(--rb-top-b));
  box-shadow:inset 0 1px 0 var(--rb-edge),inset 0 0 0 1px rgba(90,80,55,.18),inset 0 calc(var(--s)*-.008) calc(var(--s)*.012) rgba(95,85,60,.22);
  transition:transform .09s ease-out;
}
.rb.down::before{transform:translateY(calc(var(--s)*.022));box-shadow:0 1px 2px rgba(0,0,0,.4)}
.rb.down .rbcap{transform:translateY(calc(var(--s)*.022));transition-duration:.04s}
.rb:focus-visible{outline:3px solid var(--cap-hi);outline-offset:6px}
/* 小さな黒いゴムのボタン：丸く盛り上がったドームを押すと、ふにゃっと潰れる */
.gm{
  --gm-hi:#4b4c51; --gm-mid:#26272b; --gm-lo:#0a0a0c;
  all:unset;position:relative;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  width:calc(var(--s)*.17);height:calc(var(--s)*.17);
}
.gmdome{
  position:absolute;left:50%;top:50%;
  width:calc(var(--s)*.12);height:calc(var(--s)*.12);
  margin:calc(var(--s)*-.06) 0 0 calc(var(--s)*-.06);
  border-radius:50%;
  background:radial-gradient(circle at 40% 30%,var(--gm-hi) 0,var(--gm-mid) 38%,var(--gm-lo) 100%);
  box-shadow:0 calc(var(--s)*.012) calc(var(--s)*.016) var(--shadow),inset 0 calc(var(--s)*-.007) calc(var(--s)*.01) rgba(0,0,0,.65),inset 0 calc(var(--s)*.003) calc(var(--s)*.006) rgba(255,255,255,.12);
  transform-origin:50% 72%;
  transition:transform .5s cubic-bezier(.3,1.9,.5,1),box-shadow .3s ease-out; /* 離すと、ぷるんと弾んで戻る */
}
.gmdome::after{ /* つや消しゴムのやわらかい照り */
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 38% 26%,rgba(255,255,255,.22),rgba(255,255,255,0) 48%);
  transition:opacity .3s ease-out;
}
/* 膜の下のスイッチを押すと、中央がへこみ、余った皮が周りに盛り上がって放射状のしわが寄る */
.gmdent,.gmfold{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s ease-out}
.gmdent{
  background:
    radial-gradient(circle closest-side at 50% 52%,rgba(0,0,0,.7) 0,rgba(0,0,0,.45) 29%,rgba(0,0,0,0) 52%), /* へこんだ底 */
    radial-gradient(circle closest-side at 40% 36%,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 44%), /* 左上の内壁は影 */
    radial-gradient(circle closest-side at 50% 50%,rgba(255,255,255,0) 46%,rgba(255,255,255,.22) 72%,rgba(255,255,255,0) 95%); /* 余った皮の盛り上がり */
}
.gmdent::after{ /* へこみの縁のうち右下の内壁だけが光を受ける（円全体ではなく三日月状） */
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,0) 70deg,rgba(255,255,255,.26) 135deg,rgba(255,255,255,0) 200deg,rgba(255,255,255,0) 360deg);
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 52%,transparent 38%,#000 50%,transparent 62%);
  mask-image:radial-gradient(circle closest-side at 50% 52%,transparent 38%,#000 50%,transparent 62%);
}
.gmfold{
  background:
    repeating-conic-gradient(from 8deg at 50% 50%,rgba(0,0,0,.6) 0 3deg,rgba(0,0,0,0) 3deg 22deg),
    repeating-conic-gradient(from 14deg at 50% 50%,rgba(255,255,255,.16) 0 2deg,rgba(255,255,255,0) 2deg 22deg);
  -webkit-mask-image:radial-gradient(circle closest-side,transparent 46%,#000 64%,#000 80%,transparent 96%);
  mask-image:radial-gradient(circle closest-side,transparent 46%,#000 64%,#000 80%,transparent 96%);
}
.gm.down .gmdome{
  transform:scale(1.07,.9);
  box-shadow:0 calc(var(--s)*.004) calc(var(--s)*.008) var(--shadow),inset 0 calc(var(--s)*-.004) calc(var(--s)*.008) rgba(0,0,0,.6),inset 0 calc(var(--s)*.004) calc(var(--s)*.006) rgba(255,255,255,.16);
  transition:transform .09s ease-out,box-shadow .09s ease-out; /* 押すと、中央がへこんで周りがぶよっとなる */
}
.gm.down .gmdent{opacity:1;transition-duration:.06s}
.gm.down .gmfold{opacity:.5;transition-duration:.08s}
.gm.down .gmdome::after{opacity:.15}
.gm:focus-visible{outline:3px solid var(--cap-hi);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.btn::before,.cap,.lit,.glow,.rb::before,.rbcap,.gmdome,.gmdome::after,.gmdent,.gmfold,.sq,.sq::before,.sq::after,.sqface,.sqface::before,.sqface::after{transition:none}}
.gmwrap{position:relative;display:flex}
/* 机に貼られたシール（押せない） */
.bell{position:absolute;left:100%;top:50%;margin:calc(var(--s)*-.075) 0 0 calc(var(--s)*.05);width:calc(var(--s)*.15);height:calc(var(--s)*.15);border-radius:22%;transform:rotate(-5deg);display:grid;place-items:center;font-size:calc(var(--s)*.075);line-height:1;pointer-events:none;
  background:linear-gradient(145deg,#f6f1e2,#e7dfc8);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 0 0 1px rgba(120,105,70,.22),0 1px 1.5px rgba(40,42,38,.35),0 3px 6px rgba(40,42,38,.12);
  filter:grayscale(1) opacity(.7);transition:filter .2s}
.bell::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 5px,rgba(255,255,255,.18) 5px 6px);pointer-events:none}
.bell::after{content:"";position:absolute;right:0;bottom:0;width:7%;height:7%;border-radius:0 0 22% 0;background:linear-gradient(135deg,rgba(0,0,0,0) 50%,rgba(110,95,60,.28) 50%,rgba(250,246,234,.95) 100%);box-shadow:-1px -1px 2px rgba(40,42,38,.15);pointer-events:none}
.bell.on{filter:none}
.stage{position:relative}
/* 机に埋め込まれた小さな画面。普段は消灯したガラス、白いボタンを押している間だけ点灯して24時間グラフを映す */
.chart{position:absolute;left:50%;top:0;transform:translateX(-50%);width:var(--s);
  padding:calc(var(--s)*.014);border-radius:calc(var(--s)*.03);
  background:linear-gradient(var(--sq-groove),var(--sq-well));
  box-shadow:0 1px 0 var(--sq-edge),0 0 0 0 rgba(46,224,106,0);
  transition:box-shadow .45s ease-out;pointer-events:none}
.chart.on{box-shadow:0 1px 0 var(--sq-edge),0 0 calc(var(--s)*.05) calc(var(--s)*.004) rgba(46,224,106,.28);transition-duration:.08s}
.chart svg{display:block;width:100%;height:auto;border-radius:calc(var(--s)*.02);background:linear-gradient(180deg,#1c2620,#0c120e)}
.chart::before{ /* 点灯したときの画面のにじむ発光 */
  content:"";position:absolute;inset:calc(var(--s)*.014);border-radius:calc(var(--s)*.02);z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 55%,rgba(46,224,106,.32),rgba(46,224,106,.07) 70%);
  opacity:0;transition:opacity .45s ease-out}
.chart.on::before{opacity:1;transition-duration:.1s}
.chart::after{ /* ガラスの斜めの映り込みと、穴の縁が落とす影 */
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.17) 0,rgba(255,255,255,.04) 36%,rgba(255,255,255,0) 37%);
  box-shadow:inset 0 0 calc(var(--s)*.016) rgba(0,0,0,.6),inset 0 calc(var(--s)*.008) calc(var(--s)*.012) rgba(0,0,0,.3),inset 0 0 0 1px var(--sq-groove)}
.chart .c{opacity:0;transition:opacity .5s ease-out}
.chart.on .c{opacity:1;transition-duration:.1s}
.chart .t{fill:#5fe48a;font:600 8px ui-monospace,Menlo,Consolas,monospace;opacity:.6}
.chart .l{stroke:rgba(94,228,138,.17);stroke-width:.6}
.chart .now{stroke:#b8ffd0;stroke-width:.7;opacity:.85} /* 今の時刻を表す縦線 */
.note{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);max-width:min(88vw,360px);padding:8px 14px;border-radius:10px;background:rgba(30,30,30,.82);color:#fff;font:13px/1.5 system-ui,sans-serif;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:6}
.note.on{opacity:1}
</style>
</head>
<body>
<div class="stage">
<div class="chart" id="chart" aria-hidden="true"></div>
<div class="leds" id="leds" role="img"></div>
<div class="plate"><div class="well">
  <button class="btn" id="btn" type="button" aria-label="ボタン"><span class="cap"></span></button>
</div></div>
<div class="smalls">
<button class="sq" id="sq" type="button" aria-label="小さなボタン"><span class="sqface"></span></button>
<button class="rb" id="rb" type="button" aria-label="古びたボタン"><span class="rbcap"></span></button>
<div class="gmwrap"><button class="gm" id="gm" type="button" aria-label="通知のオン・オフ" aria-pressed="false"><span class="gmdome"><span class="gmdent"></span><span class="gmfold"></span></span></button><div class="bell" id="bell" role="img" aria-label="通知はオフ">🔕</div></div>
</div>
</div>
<div class="note" id="note" role="status" aria-live="polite"></div>
<script>
(function(){
  var ctx=null,noise=null;
  var samples={};
  function loadSamples(){
    var src=window.__BTN_SND;if(!src)return;
    ["down","up","sqdown","squp","rbdown","rbup","gmdown","gmup"].forEach(function(k){
      try{
        var bin=atob(src[k]),u=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
        ctx.decodeAudioData(u.buffer,function(b){samples[k]=b},function(){});
      }catch(e){}

      return pushPost("/subscribe",{topic:TOPIC,deviceId:deviceId(),subscription:sub.toJSON()});
    }).then(function(r){return r.ok});
  }

  // 通知スイッチ（ベル）
  var bell=document.getElementById("bell"),note=document.getElementById("note"),noteT=0,notifyOn=false;
  // nearBtn が true のときは、赤いボタンの中心より少し上に出す（それ以外は従来どおり画面の上部）
  function say(t,nearBtn){
    if(nearBtn){
      var r=btn.getBoundingClientRect();
      note.style.left=(r.left+r.width/2)+"px";
      note.style.top=(r.top+r.height*.36)+"px";
      note.style.transform="translate(-50%,-50%)";
    }else{note.style.left="";note.style.top="";note.style.transform=""}
    note.textContent=t;note.classList.add("on");clearTimeout(noteT);noteT=setTimeout(function(){note.classList.remove("on")},3500)}
  function setBell(on){bell.classList.toggle("on",on);bell.setAttribute("aria-label",on?"通知はオン":"通知はオフ");gm.setAttribute("aria-pressed",on?"true":"false");bell.textContent=on?"🔔":"🔕"}
  function notifyOff(){try{return localStorage.getItem(NOTIFY_OFF_KEY)==="1"}catch(e){return false}}
  function setNotifyOff(v){try{if(v)localStorage.setItem(NOTIFY_OFF_KEY,"1");else localStorage.removeItem(NOTIFY_OFF_KEY)}catch(e){}}

  var lastToggle=0;
  function toggleNotify(){
    var t=Date.now();if(t-lastToggle<400)return;lastToggle=t;
    if(!pushOK()){say("この端末・ブラウザでは通知を使えません。iPhone は「ホーム画面に追加」してから開いてください。");return}
    if(notifyOn){
      notifyOn=false;setNotifyOff(true);setBell(false);
      pushPost("/unsubscribe",{topic:TOPIC,deviceId:deviceId()}).catch(function(){});
      say("通知をオフにしました");return;
    }
    Notification.requestPermission().then(function(p){
      if(p!=="granted"){setBell(false);say("通知が許可されませんでした。ブラウザの設定から変更できます。",true);return}
      return subscribe().then(function(ok){
        notifyOn=true;setNotifyOff(false);setBell(true);
        say(ok?"通知をオンにしました。アプリを閉じていても届きます。":"通知をオンにしました。このタブを開いたままにしてください。");
      });
    }).catch(function(){say("通知を設定できませんでした")});
  }
  gm.addEventListener("click",toggleNotify);
  gm.addEventListener("keyup",function(e){if(e.key===" "||e.key==="Enter")toggleNotify()});
  setBell(false);
  if(pushOK()&&Notification.permission==="granted"&&!notifyOff()){
    notifyOn=true;setBell(true);
    subscribe().catch(function(){});
  }

  // 赤いボタンを押したとき（press() から呼ぶ）。結果（true=数えてよい / false=記録に失敗）を Promise で返す。
  //  ・記録 … Firebase の presses に時刻だけ残す（白ボタンのグラフ用）。ログイン失敗や権限エラーなど、はっきり失敗したときだけ false。
  //    8秒たっても返事がないとき（圏外など）は、後から届く可能性があるので数えたままにする（true）。
  //  ・通知 … Web Push（Cloudflare Worker）。記録が成功したとき（または Firebase を使えないとき）だけ送る。
  function announce(){
    function notify(){try{pushPost("/notify",{topic:TOPIC,deviceId:deviceId(),sender:"ボタン",preview:PRESS_TEXT}).catch(function(){})}catch(e){}}
    if(!db){notify();return Promise.resolve(true)}
    var k=null;
    try{
      var r=db.ref("presses").push();k=r.key;
      addPoint(k,Date.now()+serverOff);
      var write=ensureAuth().then(function(){return r.set({by:deviceId(),t:TS})}).then(function(){return true});
      var slow=new Promise(function(res){setTimeout(function(){res(true)},8000)});
      return Promise.race([write,slow]).then(function(){notify();cleanup();return true}).catch(function(e){
        dbg("押した記録の書き込み",e);delete pts[k];return false;
      });
    }catch(e){dbg("押した記録の書き込み",e);if(k)delete pts[k];return Promise.resolve(false)}
  }
  function clearNotes(){
    if(!notifyOn)return;
    getReg().then(function(reg){return reg.getNotifications({tag:"button"})}).then(function(l){l.forEach(function(n){n.close()})}).catch(function(){});
  }

  // ===== 白いボタンを押している間だけ出る、24時間グラフ =====
  // 横軸＝過去24時間（右端が現在）。赤ボタンが押された時刻に点を打つ。縦位置はランダムだが、できるだけ重ならないよう選ぶ。
  var serverOff=0,chartEl=document.getElementById("chart"),chartOn=false,pts={},loadingN=0; // loadingN: グラフ用のデータを読み込み中の数（0より大きい間は LOADING… を出す）
  if(db){try{db.ref(".info/serverTimeOffset").on("value",function(sn){serverOff=sn.val()||0})}catch(e){}}
  function addPoint(k,t){pts[k]=t}
  function loadPresses(){
    if(!db)return Promise.resolve();
    return ensureAuth().then(function(){return db.ref("presses").limitToLast(500).once("value")}).then(function(sn){
      sn.forEach(function(c){var v=c.val();if(v&&typeof v.t==="number")pts[c.key]=v.t});
    }).catch(function(e){dbg("押した記録の読み込み",e)});
  }
  function seeded(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
  function hashKey(k){var h=5381;for(var i=0;i<k.length;i++)h=((h<<5)+h+k.charCodeAt(i))|0;return h}
  function renderChart(){
    var W=320,H=84,L=10,R=10,T=10,B=17,pw=W-L-R,ph=H-T-B,DAY=86400000,JST=9*3600000;
    // 範囲は「その日の0時〜翌0時」（日本時間 JST。端末のタイムゾーンには左右されない）。日付が変わると、グラフは空に戻る。
    var now=Date.now()+serverOff,t0=Math.floor((now+JST)/DAY)*DAY-JST,t1=t0+DAY,SPAN=DAY,list=[];
    Object.keys(pts).forEach(function(k){var t=pts[k];if(t>=t0&&t<t1&&t<=now+60000)list.push({k:k,t:t})});
    list.sort(function(a,b){return a.t-b.t});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
      +'<defs><radialGradient id="dg"><stop offset="0" stop-color="#f4fff7"/><stop offset=".22" stop-color="#7dffa6"/><stop offset=".55" stop-color="#2ee06a"/><stop offset="1" stop-color="#2ee06a" stop-opacity="0"/></radialGradient>'
      +'<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" y="2" fill="#000" opacity=".22"/></pattern></defs>'
      +'<g class="c"><line class="l" x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'"/>';
    // 6時間ごとの目盛り（日本時間の 0・6・12・18・24 時）
    for(var h=0;h<=24;h+=6){
      var ts=t0+h*3600000,x=L+(ts-t0)/SPAN*pw;
      svg+='<line class="l" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+T+'" y2="'+(T+ph)+'"/><text class="t" text-anchor="middle" x="'+x.toFixed(1)+'" y="'+(H-5)+'">'+h+'</text>';
    }
    // 今の時刻を表す細い縦線（点より下に描く）
    var nx=L+Math.min(1,Math.max(0,(now-t0)/SPAN))*pw;
    svg+='<line class="now" x1="'+nx.toFixed(1)+'" x2="'+nx.toFixed(1)+'" y1="'+T+'" y2="'+(T+ph)+'"/>';
    // 点：各点ごとに乱数（キー由来なので毎回同じ位置）で候補を出し、すでにある点から一番離れた位置を選ぶ
    var placed=[],yMin=T+4,yMax=T+ph-4,dots='';
    list.forEach(function(p){
      var x=L+(p.t-t0)/SPAN*pw,rnd=seeded(hashKey(p.k)),best=yMin+rnd()*(yMax-yMin),bestScore=-1;
      for(var c=0;c<16;c++){
        var y=yMin+rnd()*(yMax-yMin),score=1e9;
        for(var i=placed.length-1;i>=0;i--){
          var q=placed[i],dx=x-q.x;if(dx>30)break;
          var dd=Math.sqrt(dx*dx+(y-q.y)*(y-q.y));if(dd<score)score=dd;
        }
        if(score>bestScore){bestScore=score;best=y}
      }
      placed.push({x:x,y:best});
      dots+='<circle cx="'+x.toFixed(1)+'" cy="'+best.toFixed(1)+'" r="4.2" fill="url(#dg)"/>';
    });
    svg+=dots;
    // 点がないとき：読み込み中なら LOADING…、読み込みが終わって本当に何もなければ NO DATA
    if(!list.length)svg+='<text class="t" text-anchor="middle" x="'+(W/2)+'" y="'+(T+ph/2+3)+'">'+(loadingN>0?'LOADING…':'NO DATA')+'</text>';
    chartEl.innerHTML=svg+'</g><rect width="'+W+'" height="'+H+'" fill="url(#sl)"/></svg>';
  }
  // 画面を点灯しているのが、グラフ(白ボタン)かテーマ(古びたボタン)か。消すときは自分が点けた分だけ消す。
  var screenMode="";
  function lightOn(m){screenMode=m;chartEl.classList.add("on")}
  function lightOff(m){if(screenMode===m){screenMode="";chartEl.classList.remove("on")}}
  function showChart(){
    chartOn=true;loadingN++;renderChart();lightOn("chart");
    loadPresses().then(function(){loadingN--;if(chartOn&&screenMode==="chart")renderChart();cleanup()});
  }
  function hideChart(){chartOn=false;lightOff("chart")}

  // ===== 古びたボタンを押している間、その日の「テーマ」を画面に映す =====
  // Firebase の themes に「テーマの一覧」を入れておく（文字列を1件ずつ。配列でも push キーでもよい）。
  // その日のテーマは、日付から決まる順番で一覧から1つ選ぶ（連続した日は重ならない）。同じ日・同じ一覧なら全員が同じテーマになる。
  // 日付の区切りは日本時間(JST)の0時で固定。一覧が空・未登録・通信できないときは「無条件」。
  // 最初に決まった時点で、そのテーマのキーを dailyTheme/<日付> に記録する。以降はその日、全員がそれを使うので、
  // あとから themes に項目を足したり消したりしても、今日のテーマは動かない（変わるのは明日以降）。
  var DEFAULT_THEME="無条件",themeCache=null,themeOn=false; // themeCache: {key:日付, text:その日のテーマ}
  function themeKey(addDays){
    var d=new Date(Date.now()+serverOff+9*3600000+(addDays||0)*86400000);
    function z(n){return(n<10?"0":"")+n}
    return d.getUTCFullYear()+"-"+z(d.getUTCMonth()+1)+"-"+z(d.getUTCDate());
  }
  // themes を読む。各項目は {k:キー, text:文字列}。キー順＝全端末で同じ並び。
  function fetchThemeList(){
    var def={list:[],ok:false};
    if(!db)return Promise.resolve(def);
    return ensureAuth().then(function(){return db.ref("themes").once("value")}).then(function(sn){
      var list=[];
      sn.forEach(function(c){var v=c.val();if(typeof v==="string"&&v.trim())list.push({k:c.key,text:v.trim()})});
      return{list:list,ok:true};
    }).catch(function(e){dbg("テーマの読み込み",e);return def});
  }
  function findTheme(list,k){for(var i=0;i<list.length;i++)if(list[i].k===k)return list[i];return null}
  // その日のテーマを決める。戻り値は {text, cache}（cache=true なら、このページを開いている間は使い回してよい）。
  //  1) dailyTheme/<日付> にキーが記録済みなら、それを使う。
  //  2) なければ、日付から計算して選び、記録する（先に書いた人が勝ち。負けたら、書かれていたほうを使う）。
  //  3) 記録の読み書きに失敗したときは、計算した結果をそのまま表示する（使い回さず、次回また試す）。
  function resolveTheme(key){
    var def={text:DEFAULT_THEME,cache:false};
    var flow=fetchThemeList().then(function(r){
      if(!r.ok)return def;
      if(!r.list.length)return{text:DEFAULT_THEME,cache:true};
      var ref=db.ref("dailyTheme/"+key),pick=pickTheme(r.list);
      return ref.once("value").then(function(sn){
        var pinned=findTheme(r.list,sn.val());
        if(pinned)return{text:pinned.text,cache:true};
        return ref.transaction(function(cur){return cur===null?pick.k:undefined}).then(function(res){
          var w=findTheme(r.list,res.snapshot.val())||pick;
          return{text:w.text,cache:true};
        });
      }).catch(function(e){dbg("今日のテーマの記録",e);return{text:pick.text,cache:false}});
    });
    var to=new Promise(function(res){setTimeout(function(){res(def)},4000)}); // 圏外で待ち続けないように
    return Promise.race([flow,to]);
  }
  // 日付 → その日のテーマ。連続した日に同じテーマが出ないようにする。
  //  ・一覧がn件（3件以上）のとき、n日ごとに一覧を疑似乱数でシャッフルし、その並びを1日ずつ使う（n日間は重ならない）。
  //  ・次のまとまりの先頭が、前のまとまりの最後と同じになるときは、先頭と2番目を入れ替える。
  //  ・1件ならそのテーマ、2件なら日替わりで交互。どれも日付だけで決まるので、同じ日・同じ一覧なら全員が同じテーマになる。
  function pickTheme(list){
    var n=list.length;if(!n)return DEFAULT_THEME;
    var day=Math.floor((Date.now()+serverOff+9*3600000)/86400000); // 日本時間の日数
    if(n===1)return list[0];
    if(n===2)return list[day%2];
    function deck(c){
      var a=[],r=seeded(hashKey("theme-"+c)),i,j,t;
      for(i=0;i<n;i++)a.push(i);
      for(i=n-1;i>0;i--){j=Math.floor(r()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
      return a;
    }
    var c=Math.floor(day/n),d=deck(c);
    if(d[0]===deck(c-1)[n-1]){var t=d[0];d[0]=d[1];d[1]=t}
    return list[d[day%n]];
  }
  function escSvg(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function renderTheme(text,key){
    var W=320,H=84,maxW=W-32,body;
    if(text===null){
      body='<text class="t" text-anchor="middle" x="'+(W/2)+'" y="'+(H/2+3)+'">...</text>';
    }else{
      var units=0;for(var i=0;i<text.length;i++)units+=text.charCodeAt(i)>255?1:.55;
      var size=Math.min(30,Math.max(12,maxW/Math.max(units,1))),fit=units*size>maxW?' textLength="'+maxW+'" lengthAdjust="spacingAndGlyphs"':'';
      var tx='<text text-anchor="middle" x="'+(W/2)+'" y="'+(H/2+size*.36+2)+'" font-size="'+size.toFixed(1)+'" font-weight="700" font-family="system-ui,\'Hiragino Sans\',\'Yu Gothic\',\'Noto Sans JP\',sans-serif"'+fit+'>'+escSvg(text)+'</text>';
      body=tx.replace('<text ','<text fill="#2ee06a" filter="url(#tg)" ')+tx.replace('<text ','<text fill="#c8ffd8" ')
        +'<text class="t" x="12" y="14">THEME</text><text class="t" text-anchor="end" x="'+(W-12)+'" y="14">'+escSvg(key.slice(5).replace("-","/"))+'</text>';
    }
    chartEl.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
      +'<defs><filter id="tg" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>'
      +'<pattern id="sl" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" y="2" fill="#000" opacity=".22"/></pattern></defs>'
      +'<g class="c">'+body+'</g><rect width="'+W+'" height="'+H+'" fill="url(#sl)"/></svg>';
  }
  function showTheme(){
    themeOn=true;var key=themeKey(0);
    if(themeCache&&themeCache.key===key)renderTheme(themeCache.text,key);
    else{
      renderTheme(null,key);
      resolveTheme(key).then(function(r){
        if(r.cache)themeCache={key:key,text:r.text};
        if(themeOn&&screenMode==="theme"&&themeKey(0)===key)renderTheme(r.text,key);
      });
    }
    lightOn("theme");
  }
  function hideTheme(){themeOn=false;lightOff("theme")}

  // 24時間より古い記録は消す。サーバーの定期処理は無いので、アプリを使ったとき（ボタンを押す／グラフを開く）に、
  // 古い順に取り出して消す。10分に1回までにして、通信を増やしすぎない。
  var lastClean=0;
  function cleanup(){
    if(!db)return;
    var nowL=Date.now();if(nowL-lastClean<600000)return;lastClean=nowL;
    var cutoff=nowL+serverOff-86400000;
    Object.keys(pts).forEach(function(k){if(pts[k]<cutoff)delete pts[k]});
    ensureAuth().then(function(){
      function step(n){
        return db.ref("presses").limitToFirst(200).once("value").then(function(sn){
          var up={},c=0;
          sn.forEach(function(ch){var v=ch.val();if(!v||typeof v.t!=="number"||v.t<cutoff){up[ch.key]=null;c++}});
          if(!c)return;
          return db.ref("presses").update(up).then(function(){if(c>=200&&n<10)return step(n+1)});
        });
      }
      return step(0);
    }).catch(function(e){dbg("古い記録の削除",e)});
  }
  renderChart(); // 消灯したガラスの画面を、最初から机に置いておく
  document.addEventListener("visibilitychange",function(){if(!document.hidden)clearNotes()});
})();
